spring.application.name=malai-api
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# payments-service ships its FX rate table at classpath:stub-fx-rates.yaml. When payments-service
# ran as its own Spring Boot app, its application.properties imported the file; when bundled
# inside malai-api only malai-api's application.properties is loaded as the primary config, so
# re-import the file from here. Without this, FxConversionService.supports(GBP, EUR) returns
# false and any SWIFT-to-foreign-currency payment is rejected with PAYMENT_AMOUNT_INVALID.
spring.config.import=classpath:stub-fx-rates.yaml

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m
spring.web.resources.add-mappings=false

spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${MAL_APP_DB_USERNAME:${DATABASE_USERNAME}}
spring.datasource.password=${MAL_APP_DB_PASSWORD:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${MAL_DB_MASTER_USERNAME:${DATABASE_USERNAME}}
spring.flyway.password=${MAL_DB_MASTER_PASSWORD:${DATABASE_PASSWORD}}

spring.flyway.placeholders.malai_app_password=${MAL_APP_DB_PASSWORD:${DATABASE_PASSWORD}}
spring.flyway.placeholders.db_master_username=${MAL_DB_MASTER_USERNAME:malai}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.cors=${MAL_CORS_ALLOWED_ORIGINS}

malai.aws.region=us-east-1
spring.cloud.aws.region.static=${malai.aws.region}
malai.sqs.queue-name-prefix=${MAL_SQS_QUEUE_NAME_PREFIX:}

# When blank, CognitoAdminClient.addUserToGroup short-circuits (local-dev mode).
# Wired in prod via the malai-api Cognito secret in malai-infra.
malai.aws.cognito.user-pool-id=${MAL_AWS_COGNITO_USER_POOL_ID:}

malai.account-holder.base-url=${MAL_ACCOUNT_HOLDER_BASE_URL:http://localhost:${server.port}}
malai.account.base-url=${MAL_ACCOUNT_BASE_URL:http://localhost:${server.port}}
malai.direct-debit.base-url=${MAL_DIRECT_DEBIT_BASE_URL:http://localhost:${server.port}}
malai.ledger.base-url=${MAL_LEDGER_BASE_URL:http://localhost:${server.port}}
malai.mdr.base-url=${MAL_MDR_BASE_URL:http://localhost:${server.port}}

malai.payments.screening.mode=${MAL_PAYMENTS_SCREENING_MODE:ENFORCE}
malai.payments.screening.resolver.cron=${MAL_PAYMENTS_SCREENING_RESOLVER_CRON:*/5 * * * * *}
malai.card.base-url=${MAL_CARD_BASE_URL:http://localhost:${server.port}}
malai.insights.base-url=${MAL_INSIGHTS_BASE_URL:http://localhost:${server.port}}
malai.standing-order.base-url=${MAL_STANDING_ORDER_BASE_URL:http://localhost:${server.port}}
malai.stub.base-url=${MAL_STUB_BASE_URL:http://localhost:9090}
malai.payments.base-url=${MAL_PAYMENTS_BASE_URL:http://localhost:${server.port}}
malai.fps-scheme.base-url=${MAL_FPS_SCHEME_BASE_URL:${malai.stub.base-url}}
malai.swift-scheme.base-url=${MAL_SWIFT_SCHEME_BASE_URL:${malai.stub.base-url}}
malai.bacs-scheme.base-url=${MAL_BACS_SCHEME_BASE_URL:${malai.stub.base-url}}

malai.cognito.region=${MAL_AWS_COGNITO_REGION:${malai.aws.region}}
malai.cognito.clientId=${MAL_AWS_COGNITO_CLIENT_ID}
malai.cognito.clientSecret=${MAL_AWS_COGNITO_CLIENT_SECRET}
malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.cognito.auth-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.auth-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.auth-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.auth-service.scope=malai-internal/onboarding.write

malai.cognito.account-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.account-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.account-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.account-service.scope=malai-internal/onboarding.write

malai.cognito.payments-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.payments-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.payments-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.payments-service.scope=malai-internal/onboarding.write

malai.cognito.exec-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.exec-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.exec-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.exec-service.scope=malai-internal/onboarding.write

malai.cognito.copilot-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.copilot-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.copilot-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.copilot-service.scope=malai-internal/onboarding.write

malai.cognito.aml-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.aml-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.aml-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.aml-service.scope=malai-internal/onboarding.write

malai.aml.sweep.cron=${MAL_AML_SWEEP_CRON:*/10 * * * * *}

malai.copilot.decider=${MAL_COPILOT_DECIDER:template}
malai.copilot.decider-timeout-ms=${MAL_COPILOT_DECIDER_TIMEOUT_MS:10000}
malai.copilot.anthropic.api-key=${MAL_COPILOT_ANTHROPIC_API_KEY:}
malai.copilot.anthropic.model=${MAL_COPILOT_ANTHROPIC_MODEL:claude-opus-4-8}

malai.exec.metric-timeout-ms=${MAL_EXEC_METRIC_TIMEOUT_MS:2000}
malai.exec.metric-threads=${MAL_EXEC_METRIC_THREADS:8}

malai.cognito.sandbox-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.sandbox-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.sandbox-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.sandbox-service.scope=malai-internal/onboarding.write

malai.cognito.standing-order-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.standing-order-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.standing-order-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.standing-order-service.scope=malai-internal/onboarding.write

malai.cognito.card-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.card-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.card-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.card-service.scope=malai-internal/onboarding.write

malai.cognito.card-gateway.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.card-gateway.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.card-gateway.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.card-gateway.scope=malai-internal/onboarding.write

standing-order.executor.cron=${MAL_STANDING_ORDER_EXECUTOR_CRON:0 * * * * *}
direct-debit.collection-requester.cron=${MAL_DIRECT_DEBIT_COLLECTION_REQUESTER_CRON:0 * * * * *}

malai.secured.paths=/api/v1/auth/signout, /api/v1/user, /api/v1/account-holder, /api/v1/account-holder/**, /api/v1/addresses, /api/v1/settle-up/profile, /api/v1/accounts, /api/v1/accounts/**, /api/v1/account/**, /api/v1/confirmation-of-payee, /api/v1/credit-card-applications, /api/v1/credit-card-applications/**, /api/v1/admin, /api/v1/admin/**, /api/v1/payees, /api/v1/payees/**, /api/v1/cards, /api/v1/cards/**, /api/v1/payments, /api/v1/payments/**, /api/v1/standing-orders, /api/v1/standing-orders/**, /api/v1/direct-debits, /api/v1/direct-debits/**, /api/v1/sandbox, /api/v1/sandbox/**, /api/v1/exec, /api/v1/exec/**, /api/v1/seed-demo-data

malai.bank.sort-code=${MAL_BANK_SORT_CODE}
malai.bank.bic=${MAL_BANK_BIC}

malai.auth.cookies.secure=true
malai.auth.cookies.refresh-max-age-seconds=2592000

# Demo policy: registered users are bank evaluators, so the demo platform grants
# every hat at sign-up (customer + admin groups). Role enforcement at the API is
# untouched; a real deployment leaves this off. See .scratch/three-surfaces/.
malai.auth.registration.demo-all-roles=true
