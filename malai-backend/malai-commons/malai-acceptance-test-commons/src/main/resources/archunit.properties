# Allow ArchUnit's FreezingArchRule to create the baseline store on first run.
# The store lives at archunit_store/<rule-text>.txt under each service's
# test resources and is committed to the repo. Subsequent runs accept the
# baselined violations and fail only on NEW violations.
#
# Pre-existing audit-as-port gaps (Plans 02-12 / 02-13 / 02-15 will close):
#   - AccountsController + AccountsService: no AuditWriter yet
#   - OnboardingAccountsController + OnboardingAccountsService: no AuditWriter yet
#   - AccountHolderController + AccountHolderService: no AuditWriter yet
#   - AddressController via AccountHolderService: no AuditWriter yet
#   - OnboardingController + OnboardingService: no AuditWriter yet
freeze.store.default.allowStoreCreation=true

# When a previously-frozen violation is fixed, automatically remove it from
# the baseline. This keeps the gap shrinking monotonically without manual
# baseline edits when later plans wire AuditWriter.
freeze.refreeze=true
