spring.datasource.url=jdbc:postgresql://localhost:5432/malai_test
spring.datasource.username=malai
spring.datasource.password=malai

# The malai_test container in start-docker-containers-local.sh is wiped fresh
# on each run; let Flyway bring it up to the current schema at test boot.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none

# Skip Tomcat -- this module never serves HTTP from tests.
spring.main.web-application-type=none

# Cognito/security properties are required by AuthServiceConfiguration's
# imports even though RegistrationSeederService never exercises any Cognito or
# HTTP path. Safe sentinel values keep @ConfigurationProperties binding happy.
malai.cognito.jwtToken.issuer=http://test-only-no-cognito
malai.cognito.clientId=test-client-id
malai.cognito.clientSecret=test-client-secret
malai.account-holder.base-url=http://test-only
malai.account.base-url=http://test-only
malai.ledger.base-url=http://test-only
malai.card.base-url=http://test-only
malai.stub.base-url=http://test-only
malai.payments.base-url=http://test-only
malai.insights.base-url=http://test-only
malai.standing-order.base-url=http://test-only
malai.direct-debit.base-url=http://test-only
malai.cognito.auth-service.token-endpoint-url=http://test-only
malai.cognito.auth-service.client-id=test-service-client-id
malai.cognito.auth-service.client-secret=test-service-client-secret
malai.cognito.auth-service.scope=malai-internal/onboarding.write
malai.cognito.account-service.token-endpoint-url=http://test-only
malai.cognito.account-service.client-id=test-service-client-id
malai.cognito.account-service.client-secret=test-service-client-secret
malai.cognito.account-service.scope=malai-internal/onboarding.write
malai.secured.paths=/__test-only__
malai.cors=http://localhost:5173
malai.auth.cookies.secure=false

# Account-service config that gets loaded via AccountsServiceConfiguration's
# @ComponentScan even though the registration seeder never touches the bank
# IBAN/sort-code identifier path.
malai.bank.sort-code=65-82-37
malai.bank.bic=MALAGB22XXX

# ShedLock durations short enough that consecutive test invocations don't block.
audit.verify.lock.at-most-for=10s
audit.verify.lock.at-least-for=0s
idempotency.cleanup.lock.at-most-for=10s
idempotency.cleanup.lock.at-least-for=0s

# Disarm the crons whose jobs contend with these tests on the shared malai_test state.
audit.verify.scheduler.cron=-
idempotency.cleanup.cron=-
