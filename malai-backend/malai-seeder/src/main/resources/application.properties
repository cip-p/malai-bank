spring.application.name=malai-seeder
spring.main.web-application-type=none
spring.main.banner-mode=off
server.shutdown=graceful

# Single DataSource for the seeder, running as the MASTER DB role so that:
#   * CleanCommand can TRUNCATE audit_events (the runtime malai_app role's
#     UPDATE/DELETE/TRUNCATE on audit_events is revoked per V11 grants);
#   * SeedCommand's AuditWriter.record(...) calls still succeed (INSERT works
#     under any role);
#   * MigrateCommand needs master for V12+ CREATE ROLE / GRANT.
# Local docker-compose-Postgres typically has one role for everything; CI/dev
# both flow MAL_DB_MASTER_* env vars (see ecs-malai-seeder Terraform unit).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/malai_test}
spring.datasource.username=${MAL_DB_MASTER_USERNAME:malai}
spring.datasource.password=${MAL_DB_MASTER_PASSWORD:malai}
spring.datasource.driver-class-name=org.postgresql.Driver

# We run Flyway explicitly via `--migrate`; auto-apply on boot would skip our
# placeholder wiring and re-run V12+ as the malai_app role.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.seeder.master.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/malai_test}
malai.seeder.master.username=${MAL_DB_MASTER_USERNAME:malai}
malai.seeder.master.password=${MAL_DB_MASTER_PASSWORD:malai}
malai.seeder.app.password=${MAL_APP_DB_PASSWORD:}

# Cognito Admin API target. Blank disables AdminCreate / AdminAddUserToGroup /
# AdminDeleteUser entirely (see SeederCognitoAdmin) so the seeder still works
# against a pure local docker-compose stack with no AWS credentials.
malai.aws.region=${AWS_REGION:us-east-1}
malai.aws.cognito.user-pool-id=${MAL_AWS_COGNITO_USER_POOL_ID:}

# Imported configurations require these to bind. The runtime app fills them
# from real Cognito secrets; the seeder uses dummy values that satisfy
# @ConfigurationProperties binding but are never hit because the seeder never
# calls cognitoidp.SignUp / GetUser / etc — only the Admin* paths via the
# dedicated SeederCognitoAdmin (which uses its own client + user-pool id).
malai.cognito.region=${malai.aws.region}
malai.cognito.clientId=${MAL_AWS_COGNITO_CLIENT_ID:seeder-not-used}
malai.cognito.clientSecret=${MAL_AWS_COGNITO_CLIENT_SECRET:seeder-not-used}
malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER:https://seeder-not-used.example.com}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.cognito.auth-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID:seeder-not-used}
malai.cognito.auth-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET:seeder-not-used}
malai.cognito.auth-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL:https://seeder-not-used.example.com/oauth2/token}
malai.cognito.auth-service.scope=malai-internal/onboarding.write

malai.cognito.account-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID:seeder-not-used}
malai.cognito.account-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET:seeder-not-used}
malai.cognito.account-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL:https://seeder-not-used.example.com/oauth2/token}
malai.cognito.account-service.scope=malai-internal/onboarding.write

malai.cognito.standing-order-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID:seeder-not-used}
malai.cognito.standing-order-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET:seeder-not-used}
malai.cognito.standing-order-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL:https://seeder-not-used.example.com/oauth2/token}
malai.cognito.standing-order-service.scope=malai-internal/onboarding.write

# Bank identifiers — required by AccountIdentifierFactory + AccountNumberGenerator.
# Default to the canonical Malai sort code; AccountNumberGeneratorConfiguration
# fails fast at boot if this leaves the MALAI prefix.
malai.bank.sort-code=${MAL_BANK_SORT_CODE:65-82-37}
malai.bank.bic=${MAL_BANK_BIC:MALAGB22XXX}

# AuthService cookie config is referenced by malai-api at boot; harmless here but
# included so the auth-service @ConfigurationProperties binds cleanly.
malai.auth.cookies.secure=false
malai.auth.cookies.refresh-max-age-seconds=2592000

malai.cors=${MAL_CORS_ALLOWED_ORIGINS:http://localhost:3000}

malai.account-holder.base-url=${MAL_ACCOUNT_HOLDER_BASE_URL:http://localhost:8080}
malai.account.base-url=${MAL_ACCOUNT_BASE_URL:http://localhost:8080}
malai.payments.base-url=${MAL_PAYMENTS_BASE_URL:http://localhost:8080}
malai.ledger.base-url=${MAL_LEDGER_BASE_URL:http://localhost:8080}
malai.card.base-url=${MAL_CARD_BASE_URL:http://localhost:8080}
malai.insights.base-url=${MAL_INSIGHTS_BASE_URL:http://localhost:8080}
malai.standing-order.base-url=${MAL_STANDING_ORDER_BASE_URL:http://localhost:8080}
malai.direct-debit.base-url=${MAL_DIRECT_DEBIT_BASE_URL:http://localhost:8080}
malai.stub.base-url=${MAL_STUB_BASE_URL:http://localhost:9090}

malai.secured.paths=

# Quieten Hibernate/Picocli at INFO; surface seeder logs at INFO so each step is visible.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.malai.seeder=INFO
