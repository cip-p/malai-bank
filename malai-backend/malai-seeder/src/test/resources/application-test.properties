spring.datasource.url=jdbc:postgresql://localhost:5432/malai_test
spring.datasource.username=malai
spring.datasource.password=malai
spring.datasource.driver-class-name=org.postgresql.Driver

# The malai_test container in start-docker-containers-local.sh is wiped fresh on each
# run; let Flyway bring it up to the current schema at test boot (the production seeder
# runs `--migrate` explicitly, so its application.properties disables Flyway-on-boot).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.main.web-application-type=none

# Master-role props MigrateCommand binds at construction (never run in these tests).
malai.seeder.master.url=jdbc:postgresql://localhost:5432/malai_test
malai.seeder.master.username=malai
malai.seeder.master.password=malai
malai.seeder.app.password=

# Cognito Admin API left disabled (blank user-pool-id): SeederCognitoAdmin short-circuits
# every Admin* call, so SeedCommand falls back to the static SarahMitchellSeed.USER_ID and
# no AWS credentials are needed.
malai.aws.region=us-east-1
malai.aws.cognito.user-pool-id=

# Cognito/security @ConfigurationProperties required by the imported service configs even
# though no HTTP or Cognito path is exercised. Safe sentinel values keep binding happy.
malai.cognito.region=us-east-1
malai.cognito.clientId=test-client-id
malai.cognito.clientSecret=test-client-secret
malai.cognito.jwtToken.issuer=http://test-only-no-cognito
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60
malai.cognito.auth-service.client-id=test-service-client-id
malai.cognito.auth-service.client-secret=test-service-client-secret
malai.cognito.auth-service.token-endpoint-url=http://test-only
malai.cognito.auth-service.scope=malai-internal/onboarding.write
malai.cognito.account-service.client-id=test-service-client-id
malai.cognito.account-service.client-secret=test-service-client-secret
malai.cognito.account-service.token-endpoint-url=http://test-only
malai.cognito.account-service.scope=malai-internal/onboarding.write
malai.cognito.standing-order-service.client-id=test-service-client-id
malai.cognito.standing-order-service.client-secret=test-service-client-secret
malai.cognito.standing-order-service.token-endpoint-url=http://test-only
malai.cognito.standing-order-service.scope=malai-internal/onboarding.write

malai.account-holder.base-url=http://test-only
malai.account.base-url=http://test-only
malai.payments.base-url=http://test-only
malai.ledger.base-url=http://test-only
malai.card.base-url=http://test-only
malai.insights.base-url=http://test-only
malai.standing-order.base-url=http://test-only
malai.direct-debit.base-url=http://test-only
malai.stub.base-url=http://test-only

malai.bank.sort-code=65-82-37
malai.bank.bic=MALAGB22XXX

malai.auth.cookies.secure=false
malai.auth.cookies.refresh-max-age-seconds=2592000
malai.cors=http://localhost:3000
malai.secured.paths=/__test-only__

# ShedLock durations short enough that consecutive test invocations don't block.
audit.verify.lock.at-most-for=10s
audit.verify.lock.at-least-for=0s
idempotency.cleanup.lock.at-most-for=10s
idempotency.cleanup.lock.at-least-for=0s

# Disarm the crons whose jobs contend with these tests on the shared malai_test state.
audit.verify.scheduler.cron=-
idempotency.cleanup.cron=-

logging.level.org.hibernate.SQL=WARN
logging.level.com.malai.seeder=INFO
