spring.application.name=sandbox-service

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m
spring.web.resources.add-mappings=false

spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.cors=${MAL_CORS_ALLOWED_ORIGINS}

malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.stub.base-url=${MAL_STUB_BASE_URL:http://localhost:9090}
malai.account.base-url=${MAL_ACCOUNT_BASE_URL:http://localhost:${server.port}}
malai.card.base-url=${MAL_CARD_BASE_URL:http://localhost:${server.port}}
malai.direct-debit.base-url=${MAL_DIRECT_DEBIT_BASE_URL:http://localhost:${server.port}}
malai.user-agent=sandbox-service

malai.cognito.sandbox-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.sandbox-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.sandbox-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.sandbox-service.scope=malai-internal/onboarding.write

malai.secured.paths=/api/v1/sandbox, /api/v1/sandbox/**
