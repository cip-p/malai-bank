spring.datasource.url=jdbc:postgresql://localhost:5432/malai_test
spring.datasource.username=malai
spring.datasource.password=malai

spring.flyway.enabled=false

# wiremock
malai.cognito.jwtToken.issuer=http://override-me-if-needed-for-cognito
malai.cognito.clientId=test-client-id
malai.cognito.clientSecret=test-client-secret

# Defaults; the runAuthService bootstrapper overrides the URLs to point at WireMock.
malai.account-holder.base-url=http://override-me
malai.account.base-url=http://override-me
malai.cognito.auth-service.token-endpoint-url=http://override-me
malai.cognito.auth-service.client-id=test-service-client-id
malai.cognito.auth-service.client-secret=test-service-client-secret
malai.cognito.auth-service.scope=malai-internal/onboarding.write

malai.secured.paths=/api/v1/auth/signout, /api/v1/user, /api/v1/admin, /api/v1/admin/**, /test-security/**

malai.auth.registration.demo-all-roles=true

malai.cors=http://localhost:5173,https://app.fcd8ayxqr72.com,https://app.malaibank.com

# Tests run over plain HTTP (MockMvc / acceptance RestClient on localhost), so the
# Secure attribute would prevent the browser-equivalent from sending the cookie back.
malai.auth.cookies.secure=false

# ShedLock is a per-deployment concern; in tests the goal is to exercise the @SchedulerLock
# wiring and the explicit "lock held by another instance" path, but otherwise have lock
# durations short enough that consecutive direct invocations within the same JVM don't
# block each other (default lockAtLeastFor of 5m / 30m would bleed across tests).
audit.verify.lock.at-most-for=10s
audit.verify.lock.at-least-for=0s
idempotency.cleanup.lock.at-most-for=10s
idempotency.cleanup.lock.at-least-for=0s
