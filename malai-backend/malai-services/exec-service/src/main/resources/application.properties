spring.application.name=exec-service

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m
spring.web.resources.add-mappings=false

spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.cors=${MAL_CORS_ALLOWED_ORIGINS}

malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.secured.paths=/api/v1/exec, /api/v1/exec/**

malai.account-holder.base-url=${MAL_ACCOUNT_HOLDER_BASE_URL:http://localhost:8080}
malai.payments.base-url=${MAL_PAYMENTS_BASE_URL:http://localhost:8080}
malai.card.base-url=${MAL_CARD_BASE_URL:http://localhost:8080}

malai.exec.metric-timeout-ms=${MAL_EXEC_METRIC_TIMEOUT_MS:2000}
malai.exec.metric-threads=${MAL_EXEC_METRIC_THREADS:8}

malai.cognito.exec-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.exec-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.exec-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.exec-service.scope=malai-internal/onboarding.write
