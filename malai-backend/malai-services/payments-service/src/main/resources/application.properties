spring.application.name=payments-service

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m
spring.web.resources.add-mappings=false

spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.aws.region=us-east-1
spring.cloud.aws.region.static=${malai.aws.region}

malai.cors=${MAL_CORS_ALLOWED_ORIGINS}

malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.secured.paths=/api/v1/payments, /api/v1/payments/**

malai.bank.sort-code=${MAL_BANK_SORT_CODE}
malai.bank.bic=${MAL_BANK_BIC}

malai.ledger.base-url=${MAL_LEDGER_BASE_URL:http://localhost:8080}
malai.mdr.base-url=${MAL_MDR_BASE_URL:http://localhost:8080}

malai.payments.screening.mode=${MAL_PAYMENTS_SCREENING_MODE:SHADOW}
malai.payments.screening.resolver.cron=${MAL_PAYMENTS_SCREENING_RESOLVER_CRON:*/5 * * * * *}
malai.account.base-url=${MAL_ACCOUNT_BASE_URL:http://localhost:8080}

malai.cognito.payments-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.payments-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.payments-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.payments-service.scope=malai-internal/onboarding.write

malai.sqs.queue-name-prefix=${MAL_SQS_QUEUE_NAME_PREFIX:}

spring.config.import=classpath:stub-fx-rates.yaml
