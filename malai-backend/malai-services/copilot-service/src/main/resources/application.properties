spring.application.name=copilot-service

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m
spring.web.resources.add-mappings=false

spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.cors=${MAL_CORS_ALLOWED_ORIGINS}

malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.secured.paths=/api/v1/admin/copilot, /api/v1/admin/copilot/**

malai.copilot.decider=${MAL_COPILOT_DECIDER:template}
malai.copilot.decider-timeout-ms=${MAL_COPILOT_DECIDER_TIMEOUT_MS:10000}
malai.copilot.anthropic.api-key=${MAL_COPILOT_ANTHROPIC_API_KEY:}
malai.copilot.anthropic.model=${MAL_COPILOT_ANTHROPIC_MODEL:claude-opus-4-8}

malai.payments.base-url=${MAL_PAYMENTS_BASE_URL:http://localhost:8080}
malai.ledger.base-url=${MAL_LEDGER_BASE_URL:http://localhost:8080}
malai.mdr.base-url=${MAL_MDR_BASE_URL:http://localhost:8080}

malai.cognito.copilot-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.copilot-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.copilot-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.copilot-service.scope=malai-internal/onboarding.write
