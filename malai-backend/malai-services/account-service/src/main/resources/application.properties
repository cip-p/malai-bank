spring.application.name=account-service

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m
spring.web.resources.add-mappings=false

spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

malai.cors=${MAL_CORS_ALLOWED_ORIGINS}

malai.cognito.jwtToken.issuer=${MAL_AWS_COGNITO_JWT_TOKEN_ISSUER}
malai.cognito.jwtToken.idExpiresMinutes=60
malai.cognito.jwtToken.refreshExpiresDays=30
malai.cognito.jwtToken.accessExpiresMinutes=60

malai.secured.paths=/api/v1/accounts, /api/v1/accounts/**, /api/v1/account/**, /api/v1/confirmation-of-payee, /api/v1/credit-card-applications, /api/v1/credit-card-applications/**

malai.bank.sort-code=${MAL_BANK_SORT_CODE}
malai.bank.bic=${MAL_BANK_BIC}

malai.stub.base-url=${MAL_STUB_BASE_URL:http://localhost:9090}
malai.payments.base-url=${MAL_PAYMENTS_BASE_URL}
malai.ledger.base-url=${MAL_LEDGER_BASE_URL}
malai.card.base-url=${MAL_CARD_BASE_URL}
malai.insights.base-url=${MAL_INSIGHTS_BASE_URL}
malai.standing-order.base-url=${MAL_STANDING_ORDER_BASE_URL}
malai.direct-debit.base-url=${MAL_DIRECT_DEBIT_BASE_URL}

malai.cognito.account-service.client-id=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_ID}
malai.cognito.account-service.client-secret=${MAL_AWS_COGNITO_MALAI_SERVICE_CLIENT_SECRET}
malai.cognito.account-service.token-endpoint-url=${MAL_AWS_COGNITO_MALAI_SERVICE_TOKEN_ENDPOINT_URL}
malai.cognito.account-service.scope=malai-internal/onboarding.write
